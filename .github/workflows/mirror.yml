name: Mirror inkwell-studio

on:
  push:
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch: {}

concurrency:
  group: mirror-push
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror clone of this repo
        run: git clone --mirror "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" source.git

      - name: Push mirror to the paired repo
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          cd source.git
          if [ "${{ github.repository }}" = "Nizzanki/inkwell-studio" ]; then
            DEST="agents-demo/inkwell-studio"
          else
            DEST="Nizzanki/inkwell-studio"
          fi
          git push --mirror "https://x-access-token:${MIRROR_TOKEN}@github.com/${DEST}.git"
