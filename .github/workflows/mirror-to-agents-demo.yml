name: Mirror to agents-demo/inkwell-studio

on:
  push:
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch: {}

concurrency:
  group: mirror-push
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror clone of this repo
        run: git clone --mirror "https://x-access-token:${{ github.token }}@github.com/Nizzanki/inkwell-studio.git" source.git

      - name: Push mirror to agents-demo/inkwell-studio
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          cd source.git
          git push --mirror "https://x-access-token:${MIRROR_TOKEN}@github.com/agents-demo/inkwell-studio.git"
